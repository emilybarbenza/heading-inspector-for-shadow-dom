<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo: deep open shadow DOM (no extension needed)</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 15px/1.6 system-ui, -apple-system, Segoe UI, sans-serif; color: #14181d; background: #f4f6f8; }
  @media (prefers-color-scheme: dark){ body{ color:#eef2f6; background:#0c1116; } }
</style>
</head>
<body>
<!--
  A realistic app built from OPEN shadow roots nested five components deep. No
  extension is involved. The two <script> tags at the bottom load the same
  walker + overlay the extension ships, running in the page's own world. That
  reaches every OPEN root at any depth, which is the depth most heading tools
  quit at. Closed roots need the extension (see demo/app.html), and the chip
  says so.

  Planted defects: the pricing card jumps h2 -> h4; the settings card has an
  empty <h3>.
-->
<app-shell></app-shell>

<script type="module">
  const css = `
    :host{display:block} *{box-sizing:border-box}
    h1,h2,h3,h4,h5,h6{margin:0 0 .3em}
    .wrap{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
    header.top{grid-column:1/-1;padding:18px 24px;color:#fff;background:linear-gradient(90deg,#0b5fbe,#7b1fa2)}
    nav{padding:18px;border-right:1px solid #d7dde3;background:#fff}
    @media (prefers-color-scheme:dark){nav{background:#121a22;border-color:#2a343d}}
    main{padding:24px;display:grid;gap:18px;grid-template-columns:1fr 1fr}
    .card{background:#fff;border:1px solid #d7dde3;border-radius:10px;padding:18px}
    @media (prefers-color-scheme:dark){.card{background:#121a22;border-color:#2a343d}}
    .muted{color:#5a6672} ul{margin:.3em 0 0;padding-left:1.1em}
  `;
  function open(tag, render){
    customElements.define(tag, class extends HTMLElement{
      connectedCallback(){
        if(this.__m)return; this.__m=true;
        const root=this.attachShadow({mode:'open'});
        const s=document.createElement('style'); s.textContent=css;
        const h=document.createElement('div'); root.append(s,h); render(h,root);
      }
    });
  }
  open('app-shell', el => { el.innerHTML = `
    <div class="wrap">
      <header class="top"><h1>Acme Console</h1><p class="muted" style="color:#e8ecf1">Signed in as Dana · Production</p></header>
      <nav><side-nav></side-nav></nav>
      <main><billing-card></billing-card><usage-card></usage-card><settings-card></settings-card></main>
    </div>`; });
  open('side-nav', el => { el.innerHTML = `<h2>Navigation</h2>
    <nav-section data-title="Workspace"></nav-section><nav-section data-title="Account"></nav-section>`; });
  open('nav-section', (el,root) => { el.innerHTML = `<h3>${root.host.getAttribute('data-title')}</h3><nav-links></nav-links>`; });
  open('nav-links', el => { el.innerHTML = `<h4>Quick links</h4><ul><li>Overview</li><li>Members</li><li>Audit log</li></ul>`; });
  open('billing-card', el => { el.innerHTML = `<div class="card"><h2>Billing</h2><h4>Current plan</h4><p class="muted">Team · $80 / month</p></div>`; });
  open('usage-card', el => { el.innerHTML = `<div class="card"><h2>Usage</h2><h3>This month</h3><p class="muted">1.2M requests · 340 GB egress</p></div>`; });
  open('settings-card', el => { el.innerHTML = `<div class="card"><h2>Settings</h2><h3></h3><p class="muted">This h3 is empty, which the audit flags as a violation.</p></div>`; });
</script>

<!-- The tool itself, as plain page scripts. `defer` makes them run after the
     deferred module above has defined and upgraded the components, so the shadow
     roots (and their headings) exist by the time the walker collects. This is
     all it takes to run the tool without an extension on open shadow DOM. -->
<script defer src="/extension/walker.js"></script>
<script defer src="/extension/overlay.js"></script>
</body>
</html>
